name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

  desensitize:
    name: 脱敏检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 扫描敏感信息
        run: python scripts/desensitize.py --root . --fail-on block

  android:
    name: Android 构建与单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，直接用 sdkmanager 补装所需组件，
      # 不依赖第三方 setup-android（曾在 Node 24 下失败）
      - name: 准备 Android SDK
        working-directory: .
        run: |
          set -e
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          echo "sdkmanager = $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "已安装："
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms"

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --console=plain

      - name: 编译 debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: engine/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: engine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
