name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

  desensitize:
    name: 脱敏检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 扫描敏感信息
        run: python scripts/desensitize.py --root . --fail-on block

  android:
    name: Android 构建与单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v3

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --console=plain

      - name: 编译 debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: engine/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: engine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
